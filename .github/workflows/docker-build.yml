name : Docker BUild CI

on:
  push:
    branch:
     - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: |
          docker build -t docker-ci:v1
